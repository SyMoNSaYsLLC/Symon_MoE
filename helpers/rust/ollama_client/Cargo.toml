[package]
name = "ollama_client"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for the Ollama REST API"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
futures-util = "0.3"
