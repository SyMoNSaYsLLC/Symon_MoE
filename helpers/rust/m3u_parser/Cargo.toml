[package]
name = "m3u_parser"
version = "0.1.0"
edition = "2021"
description = "M3U/M3U8 playlist parser and channel fetcher for IPTV"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
nom = "7"
