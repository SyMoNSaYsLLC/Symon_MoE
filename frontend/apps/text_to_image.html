<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Image — Symoneural</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/apps.css" />
  </head>
  <body>
    <header class="topbar">
      <h1><a href="../index.html" class="home-link">Symoneural</a> › Text to Image</h1>
    </header>

    <nav class="app-top-nav">
      <a href="../index.html">Home</a>
      <a href="chatbot.html">Chatbot</a>
      <a href="code_assist.html">Code</a>
      <a href="calculator.html">Calculator</a>
      <a href="text_to_image.html">Image</a>
      <a href="text_to_video.html">Video</a>
      <a href="iptv.html">IPTV</a>
      <a href="tensor_lab.html">Tensor</a>
      <a href="mining.html">Mining</a>
      <a href="embedded.html">Embedded</a>
      <a href="llm_ops.html">LLM Ops</a>
      <a href="terminal.html">Terminal</a>
    </nav>

    <div class="app-layout">
      <aside class="app-sidebar">
        <h3>Generation Settings</h3>

        <label>Model
          <select id="modelSelect"><option value="">Loading…</option></select>
        </label>

        <label>Prompt
          <textarea id="promptInput" rows="4" placeholder="A serene mountain lake at dawn, photorealistic, 8k"></textarea>
        </label>

        <label>Negative Prompt
          <textarea id="negPromptInput" rows="2" placeholder="blurry, low quality, watermark"></textarea>
        </label>

        <div class="row">
          <label>Width  <input id="widthInput"  type="number" value="512" min="64" step="64" /></label>
          <label>Height <input id="heightInput" type="number" value="512" min="64" step="64" /></label>
        </div>
        <div class="row">
          <label>Steps  <input id="stepsInput"  type="number" value="20"  min="1"  max="150" /></label>
          <label>CFG    <input id="cfgInput"    type="number" value="7.0" min="1"  max="30" step="0.5" /></label>
        </div>
        <label>Seed (−1 = random)
          <input id="seedInput" type="number" value="-1" />
        </label>

        <button id="generateBtn">Generate</button>
        <div id="jobStatus" class="status-bar"></div>
      </aside>

      <main class="app-main">
        <div id="gallery" class="image-gallery"></div>
        <div id="emptyState" class="empty-state">
          <p>Configure settings and click <strong>Generate</strong>.</p>
        </div>
      </main>
    </div>

    <script src="../js/apps/text_to_image.js"></script>
  </body>
</html>
